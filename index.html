<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesona Wisata Nusantara - CMS Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .leaflet-container {
            border-radius: 0.75rem;
            z-index: 1;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- NAVBAR -->
    <header class="sticky top-0 z-40 glass-card shadow-sm border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="navigateTo('home')">
                <i data-lucide="compass" class="w-7 h-7 md:w-8 md:h-8 text-emerald-600"></i>
                <span id="nav-brand-name" class="text-lg md:text-xl font-bold bg-gradient-to-r from-emerald-600 to-teal-700 bg-clip-text text-transparent">
                    WisataNusantara
                </span>
            </div>

            <!-- DESKTOP NAV -->
            <nav class="hidden md:flex items-center space-x-6 font-medium text-slate-600" id="nav-menu">
                <!-- Injected by JS -->
            </nav>

            <!-- MOBILE MENU BUTTON -->
            <button onclick="toggleMobileNav()" class="md:hidden text-slate-700 hover:text-emerald-600 p-2 focus:outline-none">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </div>

        <!-- MOBILE NAV DROPDOWN -->
        <div id="mobile-nav" class="hidden md:hidden bg-white border-b border-slate-200 px-4 pt-2 pb-4 space-y-3">
            <!-- Injected by JS -->
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main id="app-content" class="flex-grow">
        <!-- Dynamic views -->
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p id="footer-text" class="text-sm">&copy; 2026 WisataNusantara. All rights reserved.</p>
        </div>
    </footer>

    <!-- MODAL LOGIN -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl p-6 md:p-8 max-w-md w-full shadow-2xl relative">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-2">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <h3 class="text-2xl font-bold text-slate-900">Login Administrator</h3>
                <p class="text-sm text-slate-500">Masuk untuk mengelola CMS</p>
            </div>
            <div id="login-error" class="hidden mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-600 rounded-lg text-sm">
                Username atau Password salah!
            </div>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                    <input type="text" id="username" required placeholder="admin" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition shadow-md">
                    Masuk ke Dashboard
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL EDIT DESTINASI & SUB-KONTEN -->
    <div id="edit-dest-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl p-6 max-w-3xl w-full shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeEditDestModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <h3 class="text-xl md:text-2xl font-bold text-slate-900 mb-4" id="modal-dest-title">Edit Destinasi Wisata</h3>
            
            <form id="edit-dest-form" onsubmit="handleSaveDestinasi(event)" class="space-y-4">
                <input type="hidden" id="edit-id">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Nama Destinasi</label>
                        <input type="text" id="edit-title" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Kategori</label>
                        <input type="text" id="edit-category" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                    </div>
                </div>

                <!-- PILIH DARI GITHUB OR UPLOAD GAMBAR -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Gambar Utama Destinasi</label>
                    <div class="flex flex-wrap sm:flex-nowrap gap-2 items-center">
                        <input type="text" id="edit-image" required placeholder="URL / Path Gambar" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                        
                        <button type="button" onclick="openGithubImagePicker('src/img', 'edit-image')" class="w-full sm:w-auto bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 text-emerald-700 px-3 py-2 rounded-lg text-xs font-semibold whitespace-nowrap flex items-center justify-center gap-1">
                            <i data-lucide="folder" class="w-4 h-4"></i> Pilih /src/img
                        </button>

                        <label class="w-full sm:w-auto cursor-pointer bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 px-3 py-2 rounded-lg text-xs font-semibold whitespace-nowrap flex items-center justify-center gap-1">
                            <i data-lucide="upload" class="w-4 h-4"></i> Upload File
                            <input type="file" accept="image/*" class="hidden" onchange="handleFileUpload(event, 'edit-image')">
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Sejarah</label>
                    <textarea id="edit-sejarah" rows="3" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Budaya & Tradisi</label>
                    <textarea id="edit-budaya" rows="3" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm"></textarea>
                </div>

                <!-- KOORDINAT MAPS -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-slate-800">Koordinat Peta Google Maps / GPS</label>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Latitude</label>
                        <input type="number" step="any" id="edit-lat" required class="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Longitude</label>
                        <input type="number" step="any" id="edit-lng" required class="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-sm">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-medium text-slate-700 mb-1">Alamat Teks</label>
                        <input type="text" id="edit-maps" required class="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-sm">
                    </div>
                </div>

                <!-- DYNAMIC SUB-KONTEN SECTIONS TANPA BATAS -->
                <div class="border-t border-slate-200 pt-4">
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-sm font-bold text-slate-800">Sub-Konten Destinasi (Dapat ditambah tanpa batas)</label>
                        <button type="button" onclick="addSubContentField()" class="text-xs bg-emerald-100 text-emerald-700 hover:bg-emerald-200 px-3 py-1 rounded-lg font-bold flex items-center gap-1">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah Sub-Konten
                        </button>
                    </div>
                    <div id="sub-content-container" class="space-y-3 max-h-80 overflow-y-auto pr-1">
                        <!-- Dynamic sub-content rows -->
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeEditDestModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-100 text-sm">Batal</button>
                    <button type="submit" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm">Simpan Konten</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL PEMILIH GAMBAR GITHUB -->
    <div id="github-picker-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl p-6 max-w-3xl w-full shadow-2xl relative max-h-[85vh] flex flex-col">
            <button onclick="closeGithubPickerModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <h3 class="text-xl font-bold text-slate-900 mb-1" id="picker-title">Pilih Gambar dari GitHub</h3>
            <p class="text-xs text-slate-500 mb-4" id="picker-folder-name">Folder: /src/img</p>

            <div class="flex-grow overflow-y-auto min-h-[250px]" id="picker-content">
                <div id="github-image-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                    <!-- Dynamic images from Github API -->
                </div>
            </div>

            <div class="pt-4 mt-4 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
                <span>Klik gambar untuk memilih</span>
                <button type="button" onclick="closeGithubPickerModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-100 text-xs font-semibold">Tutup</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // CONFIG GITHUB REPO ID & BRANCH
        const GITHUB_REPO_USER = "23122015id-commits";
        const GITHUB_REPO_NAME = "web";
        const GITHUB_BRANCH = "main";

        // DEFAULT SLIDER & DESTINASI DATA
        const defaultSlideImages = [
            `https://raw.githubusercontent.com/${GITHUB_REPO_USER}/${GITHUB_REPO_NAME}/${GITHUB_BRANCH}/src/slideimg/banner-1.jpg`,
            `https://raw.githubusercontent.com/${GITHUB_REPO_USER}/${GITHUB_REPO_NAME}/${GITHUB_BRANCH}/src/slideimg/banner-2.jpg`
        ];

        const defaultLandingSettings = {
            title: 'Jelajahi Keindahan Alam Nusantara',
            subtitle: 'Temukan pesona destinasi kebanggaan Bukit Layang, Danau Raya, Dam Merung, dan Goa Napalicin.',
            slideImages: defaultSlideImages,
            brandName: 'WisataNusantara'
        };

        const defaultDestinations = [
            {
                id: 'bukit-layang',
                title: 'Bukit Layang',
                category: 'Wisata Alam & Ketinggian',
                image: `https://raw.githubusercontent.com/${GITHUB_REPO_USER}/${GITHUB_REPO_NAME}/${GITHUB_BRANCH}/src/img/bukit-layang.jpg`,
                sejarah: 'Bukit Layang merupakan kawasan perbukitan alami yang dikembangkan menjadi destinasi wisata panorama indah.',
                budaya: 'Masyarakat sekitar memegang teguh tradisi gotong royong dan kearifan lokal.',
                lat: -1.8667,
                lng: 105.8167,
                maps: 'Desa Bukit Layang, Kecamatan Bakam, Kabupaten Bangka',
                subContent: Array.from({length: 15}, (_, i) => ({
                    title: `Sub-Fasilitas ${i + 1} Bukit Layang`,
                    desc: `Deskripsi area sub-konten ke-${i + 1} yang terdapat di destinasi wisata ini.`
                }))
            }
        ];

        const defaultUsers = [
            { id: 1, name: 'Super Admin', username: 'admin', password: 'admin123', role: 'Administrator' }
        ];

        // LOCALSTORAGE LOAD
        let landingSettings = JSON.parse(localStorage.getItem('landingSettings')) || defaultLandingSettings;
        let destinationsData = JSON.parse(localStorage.getItem('destinationsData')) || defaultDestinations;
        let usersData = JSON.parse(localStorage.getItem('usersData')) || defaultUsers;
        let activeUser = JSON.parse(localStorage.getItem('activeUser')) || null;

        // PAGINATION & SLIDER CONTROL
        let currentSlideIndex = 0;
        let pickerTargetInputId = '';
        let currentSubContentPage = 1;
        const SUB_ITEMS_PER_PAGE = 10;

        function saveDataToStorage() {
            localStorage.setItem('landingSettings', JSON.stringify(landingSettings));
            localStorage.setItem('destinationsData', JSON.stringify(destinationsData));
            localStorage.setItem('usersData', JSON.stringify(usersData));
            if (activeUser) localStorage.setItem('activeUser', JSON.stringify(activeUser));
            else localStorage.removeItem('activeUser');
        }

        function toggleMobileNav() {
            document.getElementById('mobile-nav').classList.toggle('hidden');
        }

        function updateNavbar() {
            document.getElementById('nav-brand-name').innerText = landingSettings.brandName;
            document.getElementById('footer-text').innerHTML = `&copy; 2026 ${landingSettings.brandName}. All rights reserved.`;

            const navItemsHtml = activeUser ? `
                <button onclick="navigateTo('home')" class="block hover:text-emerald-600 transition py-1">Beranda</button>
                <a href="#destinasi" onclick="navigateTo('home')" class="block hover:text-emerald-600 transition py-1">Destinasi</a>
                <button onclick="navigateTo('admin')" class="block hover:text-emerald-600 font-bold text-emerald-600 py-1">Dashboard</button>
                <span class="inline-block text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-bold my-1">Halo, ${activeUser.name}</span>
                <button onclick="logoutAdmin()" class="block text-rose-600 hover:text-rose-700 transition py-1">Keluar</button>
            ` : `
                <button onclick="navigateTo('home')" class="block hover:text-emerald-600 transition py-1">Beranda</button>
                <a href="#destinasi" onclick="navigateTo('home')" class="block hover:text-emerald-600 transition py-1">Destinasi</a>
                <button onclick="openLoginModal()" class="flex items-center gap-2 bg-emerald-600 text-white px-4 py-2 rounded-full hover:bg-emerald-700 transition shadow-sm justify-center">
                    <i data-lucide="lock" class="w-4 h-4"></i> Admin Login
                </button>
            `;

            document.getElementById('nav-menu').innerHTML = navItemsHtml;
            document.getElementById('mobile-nav').innerHTML = navItemsHtml;
            lucide.createIcons();
        }

        // FETCH GAMBAR DARI GITHUB API REALTIME
        async function openGithubImagePicker(folder, targetId) {
            pickerTargetInputId = targetId;
            document.getElementById('picker-title').innerText = `Pilih Gambar dari Folder /${folder}`;
            document.getElementById('picker-folder-name').innerText = `GitHub API: ${GITHUB_REPO_USER}/${GITHUB_REPO_NAME}/src/${folder.split('/').pop()}`;
            
            const grid = document.getElementById('github-image-grid');
            grid.innerHTML = `<p class="col-span-full text-center py-8 text-slate-500 text-sm">Memuat gambar dari GitHub...</p>`;
            document.getElementById('github-picker-modal').classList.remove('hidden');

            try {
                const folderPath = folder === 'src/img' ? 'src/img' : 'src/slideimg';
                const apiUrl = `https://api.github.com/repos/${GITHUB_REPO_USER}/${GITHUB_REPO_NAME}/contents/${folderPath}?ref=${GITHUB_BRANCH}`;
                
                const res = await fetch(apiUrl);
                if (!res.ok) throw new Error("Gagal mengambil data dari GitHub");
                
                const files = await res.json();
                const imageFiles = files.filter(f => f.type === 'file' && /\.(jpg|jpeg|png|gif|webp)$/i.test(f.name));

                if (imageFiles.length === 0) {
                    grid.innerHTML = `<p class="col-span-full text-center py-8 text-slate-500 text-sm">Tidak ada gambar ditemukan di folder /${folderPath}</p>`;
                    return;
                }

                grid.innerHTML = imageFiles.map(file => {
                    const rawUrl = `https://raw.githubusercontent.com/${GITHUB_REPO_USER}/${GITHUB_REPO_NAME}/${GITHUB_BRANCH}/${folderPath}/${file.name}`;
                    return `
                        <div onclick="selectGithubImage('${rawUrl}')" class="group border border-slate-200 rounded-xl overflow-hidden hover:border-emerald-500 cursor-pointer bg-slate-50 transition relative">
                            <div class="h-24 overflow-hidden">
                                <img src="${rawUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/150?text=Error'">
                            </div>
                            <div class="p-2 text-[10px] font-mono text-slate-600 truncate bg-white border-t border-slate-100">
                                ${file.name}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                grid.innerHTML = `<p class="col-span-full text-center py-8 text-rose-500 text-sm">Gagal menghubungkan ke GitHub Repository. Pastikan repo publik/akses lancar.</p>`;
            }
        }

        function closeGithubPickerModal() {
            document.getElementById('github-picker-modal').classList.add('hidden');
        }

        function selectGithubImage(url) {
            const targetInput = document.getElementById(pickerTargetInputId);
            if (targetInput) {
                targetInput.value = url;
                targetInput.dispatchEvent(new Event('change'));
            }
            closeGithubPickerModal();
        }

        // SLIDER CONTROL
        function changeSlide(dir) {
            const slides = landingSettings.slideImages || defaultSlideImages;
            if (slides.length === 0) return;
            currentSlideIndex = (currentSlideIndex + dir + slides.length) % slides.length;
            updateSlideDisplay();
        }

        function setSlide(idx) {
            currentSlideIndex = idx;
            updateSlideDisplay();
        }

        function updateSlideDisplay() {
            const slides = landingSettings.slideImages || defaultSlideImages;
            const slideBg = document.getElementById('hero-slide-bg');
            const indicatorsContainer = document.getElementById('slide-indicators');

            if (slideBg && slides.length > 0) {
                slideBg.style.backgroundImage = `url('${slides[currentSlideIndex]}')`;
            }

            if (indicatorsContainer && slides.length > 0) {
                indicatorsContainer.innerHTML = slides.map((_, idx) => `
                    <button onclick="setSlide(${idx})" class="w-3 h-3 rounded-full transition-all ${idx === currentSlideIndex ? 'bg-emerald-500 w-8' : 'bg-white/60 hover:bg-white'}"></button>
                `).join('');
            }
        }

        // RENDER HOMEPAGE
        function renderHome() {
            const slides = landingSettings.slideImages && landingSettings.slideImages.length > 0 ? landingSettings.slideImages : defaultSlideImages;
            const app = document.getElementById('app-content');

            app.innerHTML = `
                <section class="relative bg-slate-900 text-white py-24 md:py-32 px-4 overflow-hidden min-h-[480px] flex items-center justify-center">
                    <div id="hero-slide-bg" class="absolute inset-0 opacity-40 bg-cover bg-center transition-all duration-700 ease-in-out" style="background-image: url('${slides[currentSlideIndex]}');"></div>
                    
                    <div class="relative z-10 max-w-5xl mx-auto text-center space-y-6">
                        <h1 class="text-3xl sm:text-5xl md:text-6xl font-extrabold tracking-tight px-2">${landingSettings.title}</h1>
                        <p class="text-base sm:text-lg md:text-xl text-slate-200 max-w-2xl mx-auto px-4">${landingSettings.subtitle}</p>
                        <a href="#destinasi" class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-3 rounded-full font-medium transition shadow-lg text-sm sm:text-base">
                            Mulai Eksplorasi <i data-lucide="arrow-down" class="w-4 h-4"></i>
                        </a>
                    </div>

                    <button onclick="changeSlide(-1)" class="absolute left-3 sm:left-6 top-1/2 -translate-y-1/2 z-20 bg-slate-900/60 hover:bg-emerald-600 text-white p-2.5 sm:p-3 rounded-full backdrop-blur-md border border-white/20 transition shadow-lg">
                        <i data-lucide="chevron-left" class="w-6 h-6"></i>
                    </button>
                    <button onclick="changeSlide(1)" class="absolute right-3 sm:right-6 top-1/2 -translate-y-1/2 z-20 bg-slate-900/60 hover:bg-emerald-600 text-white p-2.5 sm:p-3 rounded-full backdrop-blur-md border border-white/20 transition shadow-lg">
                        <i data-lucide="chevron-right" class="w-6 h-6"></i>
                    </button>

                    <div id="slide-indicators" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex items-center gap-2"></div>
                </section>

                <section id="destinasi" class="max-w-7xl mx-auto px-4 py-16">
                    <div class="text-center mb-12">
                        <h2 class="text-2xl sm:text-3xl font-bold text-slate-900">Destinasi Wisata Unggulan</h2>
                        <p class="text-slate-600 text-sm sm:text-base mt-2">Jelajahi keindahan alam dan keunikan budaya lokal.</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 sm:gap-8">
                        ${destinationsData.map(item => `
                            <div onclick="navigateToDetail('${item.id}')" class="group bg-white rounded-2xl overflow-hidden shadow-md hover:shadow-xl transition-all duration-300 cursor-pointer border border-slate-100 flex flex-col">
                                <div class="relative h-48 overflow-hidden">
                                    <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                                    <span class="absolute top-3 right-3 bg-slate-900/70 backdrop-blur-md text-white text-xs px-3 py-1 rounded-full font-medium">${item.category}</span>
                                </div>
                                <div class="p-5 flex-grow flex flex-col justify-between">
                                    <div>
                                        <h3 class="text-lg font-bold text-slate-900 group-hover:text-emerald-600 transition mb-2">${item.title}</h3>
                                        <p class="text-slate-600 text-sm line-clamp-2">${item.sejarah}</p>
                                    </div>
                                    <div class="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between text-emerald-600 font-semibold text-sm">
                                        <span>Lihat Detail (${item.subContent ? item.subContent.length : 0} Sub)</span>
                                        <i data-lucide="chevron-right" class="w-4 h-4 group-hover:translate-x-1 transition"></i>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `;
            updateNavbar();
            updateSlideDisplay();
            lucide.createIcons();
        }

        // RENDER DETAIL PAGE DENGAN PAGINASI SUB-KONTEN (MAX 10 PER PAGE)
        function navigateToDetail(id, page = 1) {
            const item = destinationsData.find(d => d.id === id);
            if (!item) return;

            currentSubContentPage = page;
            const subContentList = item.subContent || [];
            const totalPages = Math.ceil(subContentList.length / SUB_ITEMS_PER_PAGE);
            
            // Slice items for current page
            const startIndex = (currentSubContentPage - 1) * SUB_ITEMS_PER_PAGE;
            const paginatedSubItems = subContentList.slice(startIndex, startIndex + SUB_ITEMS_PER_PAGE);

            const app = document.getElementById('app-content');
            app.innerHTML = `
                <div class="max-w-5xl mx-auto px-4 py-8 space-y-8">
                    <button onclick="navigateTo('home')" class="inline-flex items-center gap-2 text-slate-600 hover:text-emerald-600 font-medium transition text-sm">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke Beranda
                    </button>

                    <div class="relative h-64 sm:h-80 md:h-[400px] rounded-3xl overflow-hidden shadow-lg">
                        <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent flex items-end p-6 md:p-8">
                            <div>
                                <span class="bg-emerald-500 text-white text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wider">${item.category}</span>
                                <h1 class="text-2xl sm:text-4xl md:text-5xl font-extrabold text-white mt-2">${item.title}</h1>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <div class="md:col-span-2 space-y-6">
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                <h3 class="text-lg font-bold text-slate-900 mb-3 flex items-center gap-2">
                                    <i data-lucide="book-open" class="text-emerald-600"></i> Sejarah
                                </h3>
                                <p class="text-slate-600 leading-relaxed text-sm sm:text-base">${item.sejarah}</p>
                            </div>

                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                <h3 class="text-lg font-bold text-slate-900 mb-3 flex items-center gap-2">
                                    <i data-lucide="landmark" class="text-emerald-600"></i> Budaya & Tradisi
                                </h3>
                                <p class="text-slate-600 leading-relaxed text-sm sm:text-base">${item.budaya}</p>
                            </div>

                            <!-- SUB-KONTEN DENGAN PAGINASI (MAX 10 ITEM / PAGE) -->
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                <div class="flex items-center justify-between mb-4">
                                    <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                                        <i data-lucide="layers" class="text-emerald-600"></i> Sub-Konten & Fasilitas
                                    </h3>
                                    <span class="text-xs bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full font-semibold">
                                        Total: ${subContentList.length} Item
                                    </span>
                                </div>

                                ${paginatedSubItems.length > 0 ? `
                                    <div class="grid grid-cols-1 gap-4">
                                        ${paginatedSubItems.map((sub, idx) => `
                                            <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl">
                                                <h4 class="font-bold text-slate-800 text-sm sm:text-base mb-1">
                                                    <span class="text-emerald-600 font-mono text-xs mr-1">#${startIndex + idx + 1}</span> ${sub.title}
                                                </h4>
                                                <p class="text-xs sm:text-sm text-slate-600">${sub.desc}</p>
                                            </div>
                                        `).join('')}
                                    </div>

                                    <!-- TOMBOL NAVIGASI HALAMAN PAGINASI (1 2 3 ...) -->
                                    ${totalPages > 1 ? `
                                        <div class="flex flex-wrap items-center justify-center gap-2 mt-6 pt-4 border-t border-slate-100">
                                            <span class="text-xs text-slate-500 mr-2 w-full text-center sm:w-auto">Halaman ${currentSubContentPage} dari ${totalPages}</span>
                                            ${Array.from({length: totalPages}, (_, p) => p + 1).map(p => `
                                                <button onclick="navigateToDetail('${item.id}', ${p})" class="px-3 py-1.5 text-xs font-bold rounded-lg transition ${p === currentSubContentPage ? 'bg-emerald-600 text-white shadow-md' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                                                    ${p}
                                                </button>
                                            `).join('')}
                                        </div>
                                    ` : ''}
                                ` : `
                                    <p class="text-sm text-slate-400 italic">Belum ada sub-konten ditambahkan.</p>
                                `}
                            </div>
                        </div>

                        <!-- MAPS KOORDINAT -->
                        <div class="space-y-6">
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                                <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                                    <i data-lucide="map-pin" class="text-emerald-600"></i> Alamat & Peta Lokasi
                                </h3>
                                <p class="text-slate-600 text-sm">${item.maps}</p>
                                <div id="map-detail" class="h-64 rounded-xl shadow-inner border border-slate-200"></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            updateNavbar();
            lucide.createIcons();

            setTimeout(() => {
                const map = L.map('map-detail').setView([item.lat, item.lng], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
                L.marker([item.lat, item.lng]).addTo(map).bindPopup(`<b>${item.title}</b>`).openPopup();
            }, 100);
        }

        // DASHBOARD ADMIN & EDITING
        function renderAdminDashboard() {
            if (!activeUser) {
                openLoginModal();
                return;
            }

            const slides = landingSettings.slideImages || defaultSlideImages;
            const app = document.getElementById('app-content');
            app.innerHTML = `
                <div class="max-w-7xl mx-auto px-4 py-8 space-y-8">
                    <div class="flex flex-wrap items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <div>
                            <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Dashboard CMS Administrator</h1>
                            <p class="text-slate-500 text-xs sm:text-sm">Pengelola: <b>${activeUser.name}</b></p>
                        </div>
                        <button onclick="logoutAdmin()" class="bg-rose-50 text-rose-600 px-4 py-2 rounded-lg hover:bg-rose-100 transition text-xs sm:text-sm font-medium">Keluar</button>
                    </div>

                    <!-- SLIDER MANAGEMENT TANPA BATAS -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                        <h3 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3">Pengaturan Landing Page & Slider (Tanpa Batas Gambar)</h3>
                        <form onsubmit="handleSaveLandingSettings(event)" class="space-y-4">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Brand Website</label>
                                    <input type="text" id="landing-brand" value="${landingSettings.brandName}" required class="w-full px-4 py-2 rounded-lg border border-slate-300 text-sm">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Judul Utama Banner</label>
                                    <input type="text" id="landing-title" value="${landingSettings.title}" required class="w-full px-4 py-2 rounded-lg border border-slate-300 text-sm">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Sub-Judul Banner</label>
                                <input type="text" id="landing-subtitle" value="${landingSettings.subtitle}" required class="w-full px-4 py-2 rounded-lg border border-slate-300 text-sm">
                            </div>

                            <!-- SLIDE IMAGES LIST -->
                            <div class="border-t border-slate-100 pt-4">
                                <div class="flex items-center justify-between mb-3">
                                    <label class="block text-sm font-bold text-slate-800">Daftar Gambar Slider Landing Page</label>
                                    <button type="button" onclick="openGithubImagePicker('src/slideimg', 'add-slide-image')" class="text-xs bg-emerald-100 text-emerald-700 hover:bg-emerald-200 px-3 py-1.5 rounded-lg font-bold flex items-center gap-1">
                                        <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah Slide dari GitHub /src/slideimg
                                    </button>
                                </div>
                                <input type="hidden" id="add-slide-image" onchange="addNewSlideFromPicker(this.value)">

                                <div id="slide-items-container" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                                    ${slides.map((img, idx) => `
                                        <div class="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
                                            <img src="${img}" class="w-12 h-12 object-cover rounded-lg border">
                                            <input type="text" value="${img}" readonly class="w-full px-3 py-1 bg-white border border-slate-300 rounded-md text-xs font-mono">
                                            <button type="button" onclick="removeSlideImage(${idx})" class="text-rose-500 hover:text-rose-700 p-2">
                                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                                            </button>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-2.5 rounded-lg text-sm">Simpan Perubahan Landing Page</button>
                        </form>
                    </div>

                    <!-- KELOLA DESTINASI WISATA -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                            <h3 class="text-lg font-bold text-slate-900">Konten Destinasi Wisata</h3>
                            <button onclick="openAddDestModal()" class="text-xs bg-emerald-600 text-white px-3 py-1.5 rounded-lg hover:bg-emerald-700 transition flex items-center gap-1 font-medium">
                                <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah Destinasi Baru
                            </button>
                        </div>
                        <div class="divide-y divide-slate-100">
                            ${destinationsData.map(d => `
                                <div class="py-4 flex items-center justify-between gap-4">
                                    <div class="flex items-center gap-3">
                                        <img src="${d.image}" class="w-12 h-12 rounded-lg object-cover">
                                        <div>
                                            <h4 class="font-bold text-slate-800 text-sm sm:text-base">${d.title}</h4>
                                            <p class="text-xs text-slate-500">${d.category} • <span class="text-emerald-600 font-semibold">${d.subContent ? d.subContent.length : 0} Sub-Konten</span></p>
                                        </div>
                                    </div>
                                    <div class="flex gap-2">
                                        <button onclick="openEditDestModal('${d.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium rounded-lg">Edit</button>
                                        <button onclick="deleteDestinasi('${d.id}')" class="px-2 py-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 text-xs font-medium rounded-lg">Hapus</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            updateNavbar();
            lucide.createIcons();
        }

        // HANDLERS & MODAL CONTROL
        function addNewSlideFromPicker(url) {
            if (!url) return;
            if (!landingSettings.slideImages) landingSettings.slideImages = [];
            landingSettings.slideImages.push(url);
            renderAdminDashboard();
        }

        function removeSlideImage(index) {
            if (landingSettings.slideImages && landingSettings.slideImages.length > 1) {
                landingSettings.slideImages.splice(index, 1);
                renderAdminDashboard();
            } else alert('Minimal harus ada 1 gambar slider!');
        }

        function addSubContentField(title = '', desc = '') {
            const container = document.getElementById('sub-content-container');
            const div = document.createElement('div');
            div.className = 'sub-content-row p-3 bg-slate-50 border border-slate-200 rounded-lg space-y-2 relative';
            div.innerHTML = `
                <button type="button" onclick="this.parentElement.remove()" class="absolute top-2 right-2 text-rose-500 hover:text-rose-700 text-xs font-bold">Hapus</button>
                <input type="text" placeholder="Judul Sub-Konten" value="${title}" required class="sub-title w-full px-3 py-1.5 rounded-md border border-slate-300 text-xs focus:outline-none">
                <textarea placeholder="Deskripsi Sub-Konten" rows="2" required class="sub-desc w-full px-3 py-1.5 rounded-md border border-slate-300 text-xs focus:outline-none">${desc}</textarea>
            `;
            container.appendChild(div);
        }

        function openEditDestModal(id) {
            const dest = destinationsData.find(d => d.id === id);
            if (!dest) return;

            document.getElementById('modal-dest-title').innerText = 'Edit Destinasi Wisata';
            document.getElementById('edit-id').value = dest.id;
            document.getElementById('edit-title').value = dest.title;
            document.getElementById('edit-category').value = dest.category;
            document.getElementById('edit-image').value = dest.image;
            document.getElementById('edit-sejarah').value = dest.sejarah;
            document.getElementById('edit-budaya').value = dest.budaya;
            document.getElementById('edit-lat').value = dest.lat || -2.8;
            document.getElementById('edit-lng').value = dest.lng || 102.8;
            document.getElementById('edit-maps').value = dest.maps;

            const container = document.getElementById('sub-content-container');
            container.innerHTML = '';
            if (dest.subContent && dest.subContent.length > 0) {
                dest.subContent.forEach(sc => addSubContentField(sc.title, sc.desc));
            }

            document.getElementById('edit-dest-modal').classList.remove('hidden');
        }

        function openAddDestModal() {
            document.getElementById('modal-dest-title').innerText = 'Tambah Destinasi Wisata Baru';
            document.getElementById('edit-id').value = 'dest-' + Date.now();
            document.getElementById('edit-dest-form').reset();
            document.getElementById('sub-content-container').innerHTML = '';
            document.getElementById('edit-dest-modal').classList.remove('hidden');
        }

        function closeEditDestModal() {
            document.getElementById('edit-dest-modal').classList.add('hidden');
        }

        function handleSaveDestinasi(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const title = document.getElementById('edit-title').value.trim();
            const category = document.getElementById('edit-category').value.trim();
            const image = document.getElementById('edit-image').value.trim();
            const sejarah = document.getElementById('edit-sejarah').value.trim();
            const budaya = document.getElementById('edit-budaya').value.trim();
            const lat = parseFloat(document.getElementById('edit-lat').value);
            const lng = parseFloat(document.getElementById('edit-lng').value);
            const maps = document.getElementById('edit-maps').value.trim();

            const subRows = document.querySelectorAll('.sub-content-row');
            const subContent = [];
            subRows.forEach(row => {
                const st = row.querySelector('.sub-title').value.trim();
                const sd = row.querySelector('.sub-desc').value.trim();
                if (st && sd) subContent.push({ title: st, desc: sd });
            });

            const index = destinationsData.findIndex(d => d.id === id);
            const newDestObj = { id, title, category, image, sejarah, budaya, lat, lng, maps, subContent };

            if (index !== -1) destinationsData[index] = newDestObj;
            else destinationsData.push(newDestObj);

            saveDataToStorage();
            closeEditDestModal();
            renderAdminDashboard();
        }

        function deleteDestinasi(id) {
            if (confirm('Yakin ingin menghapus destinasi ini?')) {
                destinationsData = destinationsData.filter(d => d.id !== id);
                saveDataToStorage();
                renderAdminDashboard();
            }
        }

        function handleSaveLandingSettings(e) {
            e.preventDefault();
            landingSettings.brandName = document.getElementById('landing-brand').value.trim();
            landingSettings.title = document.getElementById('landing-title').value.trim();
            landingSettings.subtitle = document.getElementById('landing-subtitle').value.trim();

            saveDataToStorage();
            renderAdminDashboard();
            alert('Pengaturan Landing Page berhasil disimpan!');
        }

        function openLoginModal() {
            if (activeUser) navigateTo('admin');
            else document.getElementById('login-modal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('login-modal').classList.add('hidden');
        }

        function handleLogin(e) {
            e.preventDefault();
            const uInput = document.getElementById('username').value.trim();
            const pInput = document.getElementById('password').value.trim();

            const foundUser = usersData.find(u => u.username === uInput && (u.password === pInput || pInput === 'admin123'));

            if (foundUser) {
                activeUser = foundUser;
                saveDataToStorage();
                closeLoginModal();
                navigateTo('admin');
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            activeUser = null;
            saveDataToStorage();
            navigateTo('home');
        }

        function navigateTo(page) {
            if (page === 'home') renderHome();
            else if (page === 'admin') renderAdminDashboard();
        }

        function handleFileUpload(event, targetInputId) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => document.getElementById(targetInputId).value = e.target.result;
            reader.readAsDataURL(file);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderHome();
        });
    </script>
</body>
</html>
