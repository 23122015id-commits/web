<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesona Wisata Nusantara - CMS Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .leaflet-container {
            border-radius: 0.75rem;
            z-index: 1;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- NAVBAR -->
    <header class="sticky top-0 z-40 glass-card shadow-sm border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="navigateTo('home')">
                <i data-lucide="compass" class="w-7 h-7 md:w-8 md:h-8 text-emerald-600"></i>
                <span id="nav-brand-name" class="text-lg md:text-xl font-bold bg-gradient-to-r from-emerald-600 to-teal-700 bg-clip-text text-transparent">
                    WisataNusantara
                </span>
            </div>

            <!-- DESKTOP NAV -->
            <nav class="hidden md:flex items-center space-x-6 font-medium text-slate-600" id="nav-menu">
                <!-- Injected by JS -->
            </nav>

            <!-- MOBILE MENU BUTTON -->
            <button onclick="toggleMobileNav()" class="md:hidden text-slate-700 hover:text-emerald-600 p-2 focus:outline-none">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </div>

        <!-- MOBILE NAV DROPDOWN -->
        <div id="mobile-nav" class="hidden md:hidden bg-white border-b border-slate-200 px-4 pt-2 pb-4 space-y-3">
            <!-- Injected by JS -->
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main id="app-content" class="flex-grow">
        <!-- Dynamic views -->
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p id="footer-text" class="text-sm">&copy; 2026 WisataNusantara. All rights reserved.</p>
        </div>
    </footer>

    <!-- MODAL LOGIN -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl p-6 md:p-8 max-w-md w-full shadow-2xl relative">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-2">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <h3 class="text-2xl font-bold text-slate-900">Login Administrator</h3>
                <p class="text-sm text-slate-500">Masuk untuk mengelola CMS</p>
            </div>
            <div id="login-error" class="hidden mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-600 rounded-lg text-sm">
                Username atau Password salah!
            </div>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                    <input type="text" id="username" required placeholder="admin" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition shadow-md">
                    Masuk ke Dashboard
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL POST KONTEN -->
    <div id="post-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl p-6 max-w-3xl w-full shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closePostModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <h3 class="text-xl md:text-2xl font-bold text-slate-900 mb-4" id="post-modal-title">Buat Post Baru</h3>
            
            <form id="post-form" onsubmit="handleSavePost(event)" class="space-y-4">
                <input type="hidden" id="post-edit-id">

                <!-- TIPE POST -->
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <label class="block text-sm font-bold text-slate-800 mb-2">Pilih Tipe Posting</label>
                    <select id="post-type" onchange="togglePostTypeFields()" class="w-full px-4 py-2 rounded-lg border border-slate-300 text-sm bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="destination">Destinasi Wisata Baru (Konten Utama)</option>
                        <option value="subcontent">Sub-Konten dari Destinasi Wisata</option>
                    </select>
                </div>

                <!-- FORM DESTINASI UTAMA -->
                <div id="section-destination-fields" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Nama Destinasi</label>
                            <input type="text" id="post-title" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Kategori</label>
                            <input type="text" id="post-category" placeholder="misal: Wisata Alam" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Gambar Utama Destinasi</label>
                        <div class="flex flex-wrap sm:flex-nowrap gap-2 items-center">
                            <input type="text" id="post-image" placeholder="URL / Path Gambar" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                            <button type="button" onclick="openGithubImagePicker('src/img', 'post-image')" class="w-full sm:w-auto bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 text-emerald-700 px-3 py-2 rounded-lg text-xs font-semibold whitespace-nowrap flex items-center justify-center gap-1">
                                <i data-lucide="folder" class="w-4 h-4"></i> Pilih /src/img
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Sejarah</label>
                        <textarea id="post-sejarah" rows="3" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Budaya & Tradisi</label>
                        <textarea id="post-budaya" rows="3" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <div class="md:col-span-2"><label class="block text-sm font-bold text-slate-800">Koordinat Lokasi Peta</label></div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">Latitude</label>
                            <input type="number" step="any" id="post-lat" class="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">Longitude</label>
                            <input type="number" step="any" id="post-lng" class="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-sm">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-medium text-slate-700 mb-1">Alamat Teks</label>
                            <input type="text" id="post-maps" class="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-sm">
                        </div>
                    </div>
                </div>

                <!-- FORM SUB-KONTEN -->
                <div id="section-subcontent-fields" class="space-y-4 hidden">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Pilih Destinasi Wisata Induk</label>
                        <select id="post-parent-id" class="w-full px-4 py-2 rounded-lg border border-slate-300 text-sm bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <!-- Injected dynamically -->
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Judul Sub-Konten / Jenis Wisata</label>
                        <input type="text" id="subpost-title" placeholder="misal: Wisata Air & Perahu" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Gambar Sub-Konten</label>
                        <div class="flex flex-wrap sm:flex-nowrap gap-2 items-center">
                            <input type="text" id="subpost-image" placeholder="URL / Path Gambar Sub-Konten" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                            <button type="button" onclick="openGithubImagePicker('src/img', 'subpost-image')" class="w-full sm:w-auto bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 text-emerald-700 px-3 py-2 rounded-lg text-xs font-semibold whitespace-nowrap flex items-center justify-center gap-1">
                                <i data-lucide="folder" class="w-4 h-4"></i> Pilih Gambar
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Deskripsi Sub-Konten</label>
                        <textarea id="subpost-desc" rows="3" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm"></textarea>
                    </div>

                    <div class="border-t border-slate-200 pt-4">
                        <div class="flex items-center justify-between mb-2">
                            <label class="block text-sm font-bold text-slate-800">Tambahkan Kolom Bebas / Custom Field</label>
                            <button type="button" onclick="addCustomAttrField()" class="text-xs bg-emerald-100 text-emerald-700 hover:bg-emerald-200 px-3 py-1 rounded-lg font-bold flex items-center gap-1">
                                <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah Kolom
                            </button>
                        </div>
                        <div id="custom-attrs-container" class="space-y-2">
                            <!-- Custom field key-value rows -->
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closePostModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-100 text-sm">Batal</button>
                    <button type="submit" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm">Simpan Post</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL PEMILIH GAMBAR GITHUB -->
    <div id="github-picker-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl p-6 max-w-3xl w-full shadow-2xl relative max-h-[85vh] flex flex-col">
            <button onclick="closeGithubPickerModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <h3 class="text-xl font-bold text-slate-900 mb-1" id="picker-title">Pilih Gambar dari GitHub</h3>
            <p class="text-xs text-slate-500 mb-4" id="picker-folder-name">Folder Target</p>

            <div class="flex-grow overflow-y-auto min-h-[250px]" id="picker-content">
                <div id="github-image-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                    <!-- Dynamic images from Github API -->
                </div>
            </div>

            <div class="pt-4 mt-4 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
                <span>Klik gambar untuk memilih</span>
                <button type="button" onclick="closeGithubPickerModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-100 text-xs font-semibold">Tutup</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const defaultGithubSettings = {
            user: "23122015id-commits",
            repo: "web",
            branch: "main"
        };

        const defaultLandingSettings = {
            title: 'Jelajahi Keindahan Alam Musi Rawas Utara',
            subtitle: 'Temukan pesona keindahan alam dan warisan budaya Bukit Layang, Danau Raya, Dam Merung, dan Goa Napalicin.',
            slideImages: [
                'https://raw.githubusercontent.com/23122015id-commits/web/main/src/slideimg/banner-1.jpg',
                'https://raw.githubusercontent.com/23122015id-commits/web/main/src/slideimg/banner-2.jpg'
            ],
            brandName: 'WisataNusantara'
        };

        const defaultDestinations = [
            {
                id: 'bukit-layang',
                title: 'Destinasi Wisata Bukit Layang (Danau Bukit Layang)',
                category: 'Wisata Alam & Danau Buatan',
                image: 'https://raw.githubusercontent.com/23122015id-commits/web/main/src/img/bukit-layang.jpg',
                sejarah: 'Danau Bukit Layang dibangun sekitar tahun 1980-an (kurang lebih 40 tahun lalu) yang pada awalnya difungsikan sebagai bendungan irigasi untuk mengairi lahan pertanian masyarakat. Melihat potensi lanskap alamnya yang asri, lokasi ini mulai dikembangkan serta secara resmi diresmikan oleh pemerintah daerah setempat sebagai objek wisata pada tahun 2017.',
                budaya: 'Masyarakat di sekitar Desa Bukit Ulu masih menjaga kearifan lokal dalam melestarikan lingkungan perairan dan perbukitan. Kehidupan sosial-budaya masyarakatnya sarat dengan tradisi melayu pesisir sungai/danau, seperti tradisi menangkap ikan tradisional dan gotong royong warga dalam menjaga kebersihan kawasan danau.',
                lat: -2.7163,
                lng: 102.8335,
                maps: 'Desa Bukit Ulu, Kecamatan Karang Jaya, Kabupaten Musi Rawas Utara, Sumatera Selatan. (Kata Kunci: Danau Bukit Layang Muratara)',
                subContent: [
                    {
                        title: 'Wisata Alam & Pemandangan',
                        image: 'https://raw.githubusercontent.com/23122015id-commits/web/main/src/img/bukit-layang-pemandangan.jpg',
                        desc: 'Menikmati panorama perpaduan perbukitan hijau yang asri, perairan danau jernih, dan pemandangan kawasan sungai di sekitarnya.',
                        customAttrs: [
                            { key: 'Daya Tarik', value: 'Latar perbukitan hijau & perairan tenang' },
                            { key: 'Waktu Terbaik', value: 'Pagi & Sore Hari' }
                        ]
                    },
                    {
                        title: 'Wisata Air & Jelajah Perahu',
                        image: 'https://raw.githubusercontent.com/23122015id-commits/web/main/src/img/bukit-layang-perahu.jpg',
                        desc: 'Berenang di air danau yang dingin dan jernih serta menyewa perahu motor untuk berkeliling danau seluas ±25 hektar.',
                        customAttrs: [
                            { key: 'Luas Area Wisata Air', value: '±25 Hektar' },
                            { key: 'Fasilitas Air', value: 'Perahu Motor Sewaan & Area Berenang' }
                        ]
                    }
                ]
            },
            {
                id: 'danau-raya',
                title: 'Destinasi Wisata Danau Raya (Danau Rayo)',
                category: 'Wisata Edukasi, Budaya & Hutan Lindung',
                image: 'https://raw.githubusercontent.com/23122015id-commits/web/main/src/img/danau-raya.jpg',
                sejarah: 'Kawasan hutan lindung Danau Rayo memendam cerita rakyat legendaris yang amat terkenal di Sumatera Selatan, yaitu cerita Bujang Kurap.',
                budaya: 'Selain kaya akan tradisi lisan, Danau Rayo berdekatan dengan permukiman Suku Anak Dalam (SAD).',
                lat: -2.8051,
                lng: 102.8123,
                maps: 'Desa Sungai Jernih, Kecamatan Rupit, Kabupaten Musi Rawas Utara, Sumatera Selatan.',
                subContent: []
            }
        ];

        const defaultUsers = [
            { id: 1, name: 'Super Admin', username: 'admin', password: 'admin123', role: 'Administrator' }
        ];

        let githubSettings = JSON.parse(localStorage.getItem('githubSettings')) || defaultGithubSettings;
        let landingSettings = JSON.parse(localStorage.getItem('landingSettings')) || defaultLandingSettings;
        let destinationsData = JSON.parse(localStorage.getItem('destinationsData')) || defaultDestinations;
        let usersData = JSON.parse(localStorage.getItem('usersData')) || defaultUsers;
        let activeUser = JSON.parse(localStorage.getItem('activeUser')) || null;

        let currentSlideIndex = 0;
        let pickerTargetInputId = '';
        let currentSubContentPage = 1;
        const SUB_ITEMS_PER_PAGE = 10;

        function saveDataToStorage() {
            localStorage.setItem('githubSettings', JSON.stringify(githubSettings));
            localStorage.setItem('landingSettings', JSON.stringify(landingSettings));
            localStorage.setItem('destinationsData', JSON.stringify(destinationsData));
            localStorage.setItem('usersData', JSON.stringify(usersData));
            if (activeUser) localStorage.setItem('activeUser', JSON.stringify(activeUser));
            else localStorage.removeItem('activeUser');
        }

        function toggleMobileNav() {
            document.getElementById('mobile-nav').classList.toggle('hidden');
        }

        /* NAVBAR & MODAL DASHBOARD ADMIN SESUDAH LOGIN */
        function updateNavbar() {
            document.getElementById('nav-brand-name').innerText = landingSettings.brandName;
            document.getElementById('footer-text').innerHTML = `&copy; 2026 ${landingSettings.brandName}. All rights reserved.`;

            const navItemsHtml = activeUser ? `
                <button onclick="navigateTo('home')" class="block hover:text-emerald-600 transition py-1">Beranda</button>
                <button onclick="navigateTo('admin')" class="block hover:text-emerald-600 font-bold text-emerald-600 py-1">Dashboard Admin</button>
                <span class="inline-block text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-bold my-1">Halo, ${activeUser.name}</span>
                <button onclick="logoutAdmin()" class="block text-rose-600 hover:text-rose-700 transition py-1">Keluar</button>
            ` : `
                <button onclick="navigateTo('home')" class="block hover:text-emerald-600 transition py-1">Beranda</button>
                <button onclick="openLoginModal()" class="flex items-center gap-2 bg-emerald-600 text-white px-4 py-2 rounded-full hover:bg-emerald-700 transition shadow-sm justify-center">
                    <i data-lucide="lock" class="w-4 h-4"></i> Admin Login
                </button>
            `;

            document.getElementById('nav-menu').innerHTML = navItemsHtml;
            document.getElementById('mobile-nav').innerHTML = navItemsHtml;
            lucide.createIcons();
        }

        /* OPEN GITHUB IMAGE PICKER UNTUK KONTEN UTAMA MAUPUN SUB KONTEN */
        async function openGithubImagePicker(folder, targetId) {
            pickerTargetInputId = targetId;
            const folderPath = folder;
            
            document.getElementById('picker-title').innerText = `Pilih Gambar dari Folder /${folderPath}`;
            document.getElementById('picker-folder-name').innerText = `GitHub Repo: ${githubSettings.user}/${githubSettings.repo} (${githubSettings.branch})`;
            
            const grid = document.getElementById('github-image-grid');
            grid.innerHTML = `<p class="col-span-full text-center py-8 text-slate-500 text-sm">Memuat gambar dari GitHub API...</p>`;
            document.getElementById('github-picker-modal').classList.remove('hidden');

            try {
                const apiUrl = `https://api.github.com/repos/${githubSettings.user}/${githubSettings.repo}/contents/${folderPath}?ref=${githubSettings.branch}`;
                const res = await fetch(apiUrl);
                if (!res.ok) throw new Error("Gagal mengambil data dari GitHub");
                
                const files = await res.json();
                const imageFiles = files.filter(f => f.type === 'file' && /\.(jpg|jpeg|png|gif|webp)$/i.test(f.name));

                if (imageFiles.length === 0) {
                    grid.innerHTML = `<p class="col-span-full text-center py-8 text-slate-500 text-sm">Tidak ada gambar di /${folderPath}</p>`;
                    return;
                }

                grid.innerHTML = imageFiles.map(file => {
                    const rawUrl = `https://raw.githubusercontent.com/${githubSettings.user}/${githubSettings.repo}/${githubSettings.branch}/${folderPath}/${file.name}`;
                    return `
                        <div onclick="selectGithubImage('${rawUrl}')" class="group border border-slate-200 rounded-xl overflow-hidden hover:border-emerald-500 cursor-pointer bg-slate-50 transition relative">
                            <div class="h-24 overflow-hidden">
                                <img src="${rawUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/150?text=Error'">
                            </div>
                            <div class="p-2 text-[10px] font-mono text-slate-600 truncate bg-white border-t border-slate-100">
                                ${file.name}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                grid.innerHTML = `<p class="col-span-full text-center py-8 text-rose-500 text-sm">Gagal terhubung ke Repositori GitHub (${githubSettings.user}/${githubSettings.repo}).</p>`;
            }
        }

        function closeGithubPickerModal() {
            document.getElementById('github-picker-modal').classList.add('hidden');
        }

        function selectGithubImage(url) {
            if (pickerTargetInputId) {
                const targetInput = document.getElementById(pickerTargetInputId);
                if (targetInput) {
                    targetInput.value = url;
                }
            }
            closeGithubPickerModal();
        }

        // SLIDER CONTROL
        function changeSlide(dir) {
            const slides = landingSettings.slideImages;
            if (!slides || slides.length === 0) return;
            currentSlideIndex = (currentSlideIndex + dir + slides.length) % slides.length;
            updateSlideDisplay();
        }

        function setSlide(idx) {
            currentSlideIndex = idx;
            updateSlideDisplay();
        }

        function updateSlideDisplay() {
            const slides = landingSettings.slideImages || [];
            const slideBg = document.getElementById('hero-slide-bg');
            const indicatorsContainer = document.getElementById('slide-indicators');

            if (slideBg && slides.length > 0) {

        function openPostModal(editId = null) {
            document.getElementById('post-form').reset();
            document.getElementById('post-edit-id').value = editId || '';
            document.getElementById('custom-attrs-container').innerHTML = '';

            const parentSelect = document.getElementById('post-parent-id');
            parentSelect.innerHTML = destinationsData.map(d => `<option value="${d.id}">${d.title}</option>`).join('');

            if (editId) {
                const dest = destinationsData.find(d => d.id === editId);
                if (dest) {
                    document.getElementById('post-type').value = 'destination';
                    document.getElementById('post-title').value = dest.title;
                    document.getElementById('post-category').value = dest.category;
                    document.getElementById('post-image').value = dest.image;
                    document.getElementById('post-sejarah').value = dest.sejarah;
                    document.getElementById('post-budaya').value = dest.budaya;
                    document.getElementById('post-lat').value = dest.lat || '';
                    document.getElementById('post-lng').value = dest.lng || '';
                    document.getElementById('post-maps').value = dest.maps || '';
                }
            }

            togglePostTypeFields();
            document.getElementById('post-modal').classList.remove('hidden');
            lucide.createIcons();
        }

            document.getElementById('post-modal').classList.add('hidden');

        function togglePostTypeFields() {
            const type = document.getElementById('post-type').value;
            const destFields = document.getElementById('section-destination-fields');
            const subFields = document.getElementById('section-subcontent-fields');

            if (type === 'destination') {
                destFields.classList.remove('hidden');
                subFields.classList.add('hidden');
            } else {
                destFields.classList.add('hidden');
                subFields.classList.remove('hidden');
            }
        }

        function addCustomAttrField(key = '', val = '') {
            const container = document.getElementById('custom-attrs-container');
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center";
            div.innerHTML = `
                <input type="text" placeholder="Nama Kolom" value="${key}" class="custom-key w-1/2 px-3 py-1.5 rounded-lg border border-slate-300 text-xs">

                <button type="button" onclick="this.parentElement.remove()" class="text-rose-500 p-1 hover:bg-rose-50 rounded">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
            `;
            container.appendChild(div);

        }

        function handleSavePost(e) {
            e.preventDefault();
            const type = document.getElementById('post-type').value;
            const editId = document.getElementById('post-edit-id').value;

            if (type === 'destination') {
                const title = document.getElementById('post-title').value;
                const category = document.getElementById('post-category').value;
                const image = document.getElementById('post-image').value;
                const sejarah = document.getElementById('post-sejarah').value;
                const budaya = document.getElementById('post-budaya').value;
                const lat = parseFloat(document.getElementById('post-lat').value) || 0;
                const lng = parseFloat(document.getElementById('post-lng').value) || 0;
                const maps = document.getElementById('post-maps').value;

                if (editId) {
                    const idx = destinationsData.findIndex(d => d.id === editId);
                    if (idx !== -1) {
                        destinationsData[idx] = {
                            ...destinationsData[idx],
                            title, category, image, sejarah, budaya, lat, lng, maps
                        };
                    }
                } else {
                    const newId = title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                    destinationsData.push({
                        id: newId,
                        title, category, image, sejarah, budaya, lat, lng, maps,
                        subContent: []
                    });
                }
            } else {
                const parentId = document.getElementById('post-parent-id').value;
                const subTitle = document.getElementById('subpost-title').value;
                const subImage = document.getElementById('subpost-image').value;
                const subDesc = document.getElementById('subpost-desc').value;

                const customAttrs = [];
                const keys = document.querySelectorAll('.custom-key');
                const vals = document.querySelectorAll('.custom-val');
                keys.forEach((k, idx) => {
                    if (k.value.trim() !== '') {
                        customAttrs.push({ key: k.value.trim(), value: vals[idx].value.trim() });
                    }
                });

                const parent = destinationsData.find(d => d.id === parentId);
                if (parent) {
                    if (!parent.subContent) parent.subContent = [];
                    parent.subContent.push({
                        title: subTitle,
                        image: subImage,
                        desc: subDesc,
                        customAttrs
                    });
                }
            }

            saveDataToStorage();
            closePostModal();
            renderAdmin();
        }

            openPostModal(id);
        }

        function deleteDestination(id) {
            if (confirm("Apakah Anda yakin ingin menghapus destinasi ini?")) {
                destinationsData = destinationsData.filter(d => d.id !== id);
                saveDataToStorage();
                renderAdmin();
            }
        }

        function deleteSubContent(parentId, subIdx) {
            if (confirm("Apakah Anda yakin ingin menghapus sub-konten ini?")) {
                const parent = destinationsData.find(d => d.id === parentId);
                if (parent && parent.subContent) {
                    parent.subContent.splice(subIdx, 1);
                    saveDataToStorage();
                    renderAdmin();
                }
            }
        }

        function navigateTo(page) {
            if (page === 'home') {
                renderHome();
            } else if (page === 'admin') {
                renderAdmin();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateNavbar();
            renderHome();
        });
    </script>
</body>
</html>
