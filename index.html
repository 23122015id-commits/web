<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesona Wisata Muratara & Bangka</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- NAVBAR -->
    <header class="sticky top-0 z-50 glass-card shadow-sm border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="navigateTo('home')">
                <i data-lucide="compass" class="w-8 h-8 text-emerald-600"></i>
                <span class="text-xl font-bold bg-gradient-to-r from-emerald-600 to-teal-700 bg-clip-text text-transparent">
                    WisataNusantara
                </span>
            </div>
            <nav class="hidden md:flex items-center space-x-6 font-medium text-slate-600">
                <button onclick="navigateTo('home')" class="hover:text-emerald-600 transition">Beranda</button>
                <a href="#destinasi" onclick="navigateTo('home')" class="hover:text-emerald-600 transition">Destinasi</a>
                <button onclick="openLoginModal()" class="flex items-center gap-2 bg-emerald-600 text-white px-4 py-2 rounded-full hover:bg-emerald-700 transition shadow-sm">
                    <i data-lucide="lock" class="w-4 h-4"></i> Admin Login
                </button>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main id="app-content" class="flex-grow">
        <!-- Content dynamically injected via JavaScript -->
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-sm">&copy; 2026 WisataNusantara. All rights reserved.</p>
        </div>
    </footer>

    <!-- MODAL LOGIN ADMIN -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full mx-4 shadow-2xl relative">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-2">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <h3 class="text-2xl font-bold text-slate-900">Login Administrator</h3>
                <p class="text-sm text-slate-500">Masuk untuk mengelola konten & user</p>
            </div>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                    <input type="text" id="username" required value="admin" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="password" required value="admin123" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition shadow-md">
                    Masuk ke Dashboard
                </button>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // DATA WISATA INITIAL
        const destinationsData = [
            {
                id: 'bukit-layang',
                title: 'Bukit Layang',
                category: 'Wisata Alam & Ketinggian',
                image: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80',
                sejarah: 'Bukit Layang awalnya merupakan kawasan perbukitan alami yang difungsikan oleh warga sekitar sebagai lahan perkebunan. Seiring berkembangnya tren wisata alam, perbukitan ini dikembangkan menjadi destinasi wisata panorama.',
                budaya: 'Masyarakat sekitar memegang teguh tradisi gotong royong dan kearifan lokal dalam menjaga kelestarian hutan perbukitan dengan kebudayaan khas Melayu/Sumatra.',
                dayaTarik: ['Pemandangan Ketinggian', 'Spot Foto & Sunrise', 'Area Camping'],
                maps: 'Desa Bukit Layang, Kecamatan Bakam, Kabupaten Bangka, Kepulauan Bangka Belitung',
                embedMaps: 'https://maps.google.com/maps?q=Bukit+Layang+Bangka&t=&z=13&ie=UTF8&iwloc=&output=embed'
            },
            {
                id: 'danau-raya',
                title: 'Danau Raya',
                category: 'Wisata Air Alami',
                image: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80',
                sejarah: 'Danau Raya merupakan danau alami yang terbentuk dari proses geologi dan resapan air sungai. Keberadaan danau ini telah lama menjadi sumber kehidupan masyarakat untuk perikanan.',
                budaya: 'Masyarakat memiliki tradisi menangkap ikan bersama pada musim tertentu (seperti tradisi Melemang/Bemasak) dan menjaga kelestarian perairan.',
                dayaTarik: ['Wisata Air & Perahu Tradisional', 'Spot Pemancingan', 'Suasana Asri untuk Piknik'],
                maps: 'Desa Danau Raya, Kecamatan Rupit, Kabupaten Musi Rawas Utara, Sumatra Selatan',
                embedMaps: 'https://maps.google.com/maps?q=Danau+Raya+Muratara&t=&z=13&ie=UTF8&iwloc=&output=embed'
            },
            {
                id: 'dam-merung',
                title: 'Dam Merung',
                category: 'Rekreasi Pemandian Alam',
                image: 'https://images.unsplash.com/photo-1432405972618-c60b0225b8f9?auto=format&fit=crop&w=800&q=80',
                sejarah: 'Dibangun sebagai bendungan dan sarana irigasi teknis. Seiring berjalannya waktu, aliran air yang jernih dan struktur bendungan yang unik menarik perhatian warga hingga menjadi lokasi wisata.',
                budaya: 'Erat kaitannya dengan budaya agraris masyarakat setempat sebagai simbol manunggalnya sistem pertanian tradisional dengan pengelolaan air.',
                dayaTarik: ['Pemandian Alam Segar', 'Taman Rekreasi Pinggir Air', 'Fotografi Lanskap Bendungan'],
                maps: 'Kecamatan Rawas Ilir / Karang Dapo, Kabupaten Musi Rawas Utara, Sumatra Selatan',
                embedMaps: 'https://maps.google.com/maps?q=Dam+Merung+Muratara&t=&z=13&ie=UTF8&iwloc=&output=embed'
            },
            {
                id: 'goa-napalicin',
                title: 'Goa Napalicin',
                category: 'Wisata Speleologi & Karst',
                image: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80',
                sejarah: 'Goa alam karst legendaris yang terbentuk selama ribuan tahun. Dalam sejarah lokal, goa ini pernah digunakan sebagai tempat perlindungan dan tempat bertapa.',
                budaya: 'Dianggap sebagai warisan leluhur yang berharga dengan berbagai cerita rakyat dan legenda lokal mengenai keunikan lorong-lorong batu kapurnya.',
                dayaTarik: ['Stalaktit & Stalagmit Purba', 'Celah Cahaya Spektakuler (Ray of Light)', 'Petualangan Jelajah Lorong'],
                maps: 'Desa Napalicin, Kecamatan Rawas Ulu, Kabupaten Musi Rawas Utara, Sumatra Selatan',
                embedMaps: 'https://maps.google.com/maps?q=Goa+Napalicin+Muratara&t=&z=13&ie=UTF8&iwloc=&output=embed'
            }
        ];

        let usersData = [
            { id: 1, name: 'Super Admin', username: 'admin', role: 'Administrator' },
            { id: 2, name: 'Editor Konten', username: 'editor1', role: 'Editor' }
        ];

        let isAdminLoggedIn = false;

        // RENDER HOMEPAGE
        function renderHome() {
            const app = document.getElementById('app-content');
            app.innerHTML = `
                <!-- HERO SECTION -->
                <section class="relative bg-slate-900 text-white py-24 px-4 overflow-hidden">
                    <div class="absolute inset-0 opacity-40 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=1600&q=80');"></div>
                    <div class="relative max-w-5xl mx-auto text-center space-y-6">
                        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight">Jelajahi Keindahan Alam Nusantara</h1>
                        <p class="text-lg md:text-xl text-slate-200 max-w-2xl mx-auto">Temukan pesona destinasi kebanggaan Bukit Layang, Danau Raya, Dam Merung, dan Goa Napalicin.</p>
                        <a href="#destinasi" class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-3 rounded-full font-medium transition shadow-lg">
                            Mulai Eksplorasi <i data-lucide="arrow-down" class="w-4 h-4"></i>
                        </a>
                    </div>
                </section>

                <!-- GRID 4 DESTINASI -->
                <section id="destinasi" class="max-w-7xl mx-auto px-4 py-16">
                    <div class="text-center mb-12">
                        <h2 class="text-3xl font-bold text-slate-900">4 Destinasi Wisata Unggulan</h2>
                        <p class="text-slate-600 mt-2">Klik pada destinasi untuk melihat informasi rinci, sejarah, budaya, dan lokasi.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                        ${destinationsData.map(item => `
                            <div onclick="navigateToDetail('${item.id}')" class="group bg-white rounded-2xl overflow-hidden shadow-md hover:shadow-xl transition-all duration-300 cursor-pointer border border-slate-100 flex flex-col">
                                <div class="relative h-48 overflow-hidden">
                                    <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                                    <span class="absolute top-3 right-3 bg-slate-900/70 backdrop-blur-md text-white text-xs px-3 py-1 rounded-full font-medium">${item.category}</span>
                                </div>
                                <div class="p-5 flex-grow flex flex-col justify-between">
                                    <div>
                                        <h3 class="text-xl font-bold text-slate-900 group-hover:text-emerald-600 transition mb-2">${item.title}</h3>
                                        <p class="text-slate-600 text-sm line-clamp-2">${item.sejarah}</p>
                                    </div>
                                    <div class="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between text-emerald-600 font-semibold text-sm">
                                        <span>Lihat Detail</span>
                                        <i data-lucide="chevron-right" class="w-4 h-4 group-hover:translate-x-1 transition"></i>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `;
            lucide.createIcons();
        }

        // RENDER DETAIL PAGE
        function navigateToDetail(id) {
            const item = destinationsData.find(d => d.id === id);
            if (!item) return;

            const app = document.getElementById('app-content');
            app.innerHTML = `
                <div class="max-w-5xl mx-auto px-4 py-8 space-y-8">
                    <button onclick="navigateTo('home')" class="inline-flex items-center gap-2 text-slate-600 hover:text-emerald-600 font-medium transition">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke Beranda
                    </button>

                    <div class="relative h-80 md:h-[400px] rounded-3xl overflow-hidden shadow-lg">
                        <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent flex items-end p-8">
                            <div>
                                <span class="bg-emerald-500 text-white text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wider">${item.category}</span>
                                <h1 class="text-4xl md:text-5xl font-extrabold text-white mt-2">${item.title}</h1>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <div class="md:col-span-2 space-y-6">
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                <h3 class="text-xl font-bold text-slate-900 mb-3 flex items-center gap-2">
                                    <i data-lucide="book-open" class="text-emerald-600"></i> Sejarah
                                </h3>
                                <p class="text-slate-600 leading-relaxed">${item.sejarah}</p>
                            </div>

                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                <h3 class="text-xl font-bold text-slate-900 mb-3 flex items-center gap-2">
                                    <i data-lucide="landmark" class="text-emerald-600"></i> Budaya & Khas Lokal
                                </h3>
                                <p class="text-slate-600 leading-relaxed">${item.budaya}</p>
                            </div>

                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                <h3 class="text-xl font-bold text-slate-900 mb-3 flex items-center gap-2">
                                    <i data-lucide="sparkles" class="text-emerald-600"></i> Daya Tarik Wisata
                                </h3>
                                <ul class="space-y-2">
                                    ${item.dayaTarik.map(dt => `
                                        <li class="flex items-center gap-2 text-slate-700">
                                            <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500"></i> ${dt}
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        </div>

                        <div class="space-y-6">
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                                <h3 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                                    <i data-lucide="map-pin" class="text-emerald-600"></i> Alamat & Lokasi
                                </h3>
                                <p class="text-slate-600 text-sm">${item.maps}</p>
                                <div class="rounded-xl overflow-hidden h-48 border border-slate-200">
                                    <iframe src="${item.embedMaps}" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            window.scrollTo(0, 0);
            lucide.createIcons();
        }

        // RENDER ADMIN DASHBOARD
        function renderAdminDashboard() {
            const app = document.getElementById('app-content');
            app.innerHTML = `
                <div class="max-w-7xl mx-auto px-4 py-8 space-y-8">
                    <div class="flex items-center justify-between bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <div>
                            <h1 class="text-2xl font-bold text-slate-900">Dashboard Admin CMS</h1>
                            <p class="text-slate-500 text-sm">Kelola konten destinasi wisata dan manajemen user</p>
                        </div>
                        <button onclick="logoutAdmin()" class="flex items-center gap-2 bg-rose-50 text-rose-600 px-4 py-2 rounded-lg hover:bg-rose-100 transition font-medium">
                            <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
                        </button>
                    </div>

                    <!-- TAB KONTEN & USER -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <!-- MANAJEMEN DESTINASI -->
                        <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                            <h3 class="text-xl font-bold text-slate-900">Daftar Destinasi Wisata</h3>
                            <div class="divide-y divide-slate-100">
                                ${destinationsData.map(d => `
                                    <div class="py-4 flex items-center justify-between gap-4">
                                        <div class="flex items-center gap-3">
                                            <img src="${d.image}" class="w-12 h-12 rounded-lg object-cover">
                                            <div>
                                                <h4 class="font-bold text-slate-800">${d.title}</h4>
                                                <p class="text-xs text-slate-500">${d.category}</p>
                                            </div>
                                        </div>
                                        <div class="flex gap-2">
                                            <button onclick="alert('Fitur Edit Konten: ${d.title}')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg">Edit</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- MANAJEMEN USER -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                            <div class="flex items-center justify-between">
                                <h3 class="text-xl font-bold text-slate-900">Manajemen User</h3>
                                <button onclick="addUser()" class="text-xs bg-emerald-600 text-white px-3 py-1.5 rounded-lg hover:bg-emerald-700">+ Tambah</button>
                            </div>
                            <div class="space-y-3">
                                ${usersData.map(u => `
                                    <div class="p-3 bg-slate-50 rounded-xl flex items-center justify-between">
                                        <div>
                                            <p class="font-bold text-sm text-slate-800">${u.name}</p>
                                            <p class="text-xs text-slate-500">@${u.username} • <span class="text-emerald-600">${u.role}</span></p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // NAVIGATION LOGIC
        function navigateTo(page) {
            if (page === 'home') renderHome();
            else if (page === 'admin') renderAdminDashboard();
        }

        // LOGIN & MODAL LOGIC
        function openLoginModal() {
            if (isAdminLoggedIn) {
                navigateTo('admin');
            } else {
                document.getElementById('login-modal').classList.remove('hidden');
            }
        }

        function closeLoginModal() {
            document.getElementById('login-modal').classList.add('hidden');
        }

        function handleLogin(e) {
            e.preventDefault();
            isAdminLoggedIn = true;
            closeLoginModal();
            navigateTo('admin');
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            navigateTo('home');
        }

        function addUser() {
            const name = prompt("Masukkan Nama User:");
            const username = prompt("Masukkan Username:");
            if (name && username) {
                usersData.push({ id: Date.now(), name, username, role: 'Editor' });
                renderAdminDashboard();
            }
        }

        // INITIAL LOAD
        document.addEventListener('DOMContentLoaded', () => {
            renderHome();
        });
    </script>
</body>
</html>
